<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — ПрактикаДок</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0d1117;--border:#21262d;--accent:#2f81f7;--text:#e6edf3;--muted:#8b949e;--card:#1c2128;--input:#0d1117;--err:#f85149}
        body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px;position:relative}
        body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(47,129,247,.06) 1px,transparent 0);background-size:32px 32px;pointer-events:none}
        .glow{position:fixed;border-radius:50%;filter:blur(140px);opacity:.1;pointer-events:none}
        .glow-1{width:600px;height:600px;background:#3fb950;bottom:-200px;left:-100px}
        .wrapper{position:relative;z-index:1;width:100%;max-width:400px}
        .logo{display:flex;align-items:center;gap:10px;margin-bottom:32px;justify-content:center;text-decoration:none;color:var(--text)}
        .logo-icon{width:38px;height:38px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px}
        .logo-name{font-size:20px;font-weight:800;letter-spacing:-.4px}
        .logo-name span{color:var(--accent)}
        .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px}
        h1{font-size:22px;font-weight:800;margin-bottom:6px}
        .hint{color:var(--muted);font-size:13px;margin-bottom:28px}
        .form-group{margin-bottom:16px}
        label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.3px;text-transform:uppercase}
        input[type=text],input[type=password]{width:100%;padding:11px 14px;background:var(--input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Manrope',sans-serif;font-size:14px;transition:border-color .15s;outline:none}
        input:focus{border-color:var(--accent)}
        .btn{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Manrope',sans-serif;cursor:pointer;transition:all .15s;margin-top:8px}
        .btn:hover{background:#388bfd;transform:translateY(-1px)}
        .footer-link{text-align:center;margin-top:20px;font-size:13px;color:var(--muted)}
        .footer-link a{color:var(--accent);text-decoration:none;font-weight:600}
        .error-msg{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);border-radius:8px;padding:10px 14px;color:var(--err);font-size:13px;margin-bottom:16px}
        .pass-hint{font-size:11px;color:var(--muted);margin-top:5px}
    </style>
</head>
<body>
    <div class="glow glow-1"></div>
    <div class="wrapper">
        <a href="/" class="logo">
            <div class="logo-icon">📄</div>
            <div class="logo-name">Практика<span>Док</span></div>
        </a>
        <div class="card">
            <h1>Регистрация</h1>
            <p class="hint">Создайте аккаунт для работы с документами</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="error-msg">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" name="username" placeholder="Придумайте логин" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" name="password1" placeholder="Минимум 8 символов" required>
                    <div class="pass-hint">Минимум 8 символов, не только цифры</div>
                </div>
                <div class="form-group">
                    <label>Повторите пароль</label>
                    <input type="password" name="password2" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn">Зарегистрироваться</button>
            </form>
            <div class="footer-link">
                Уже есть аккаунт? <a href="/login/">Войти</a>
            </div>
        </div>
    </div>
</body>
</html>
