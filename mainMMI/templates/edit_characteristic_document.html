<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактировать характеристику — ПрактикаДок</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0d1117;--border:#21262d;--accent:#2f81f7;--accent2:#3fb950;--text:#e6edf3;--muted:#8b949e;--card:#1c2128;--input:#0d1117}
        body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        .header{background:#161b22;border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:100}
        .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
        .logo-icon{width:32px;height:32px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px}
        .logo-name{font-size:17px;font-weight:800;letter-spacing:-.4px}
        .logo-name span{color:var(--accent)}
        .main{max-width:800px;margin:0 auto;padding:32px 24px}
        .page-title{font-size:22px;font-weight:800;margin-bottom:6px}
        .page-sub{color:var(--muted);font-size:13px;margin-bottom:28px}
        .card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:16px}
        .card-head{padding:14px 24px;border-bottom:1px solid var(--border)}
        .card-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
        .card-body{padding:22px 24px}
        .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
        .form-group{display:flex;flex-direction:column;gap:5px}
        .form-group.full{grid-column:1/-1}
        label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
        input[type=text],input[type=date],input[type=number],textarea{background:var(--input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Manrope',sans-serif;font-size:14px;padding:9px 12px;outline:none;transition:border-color .15s;width:100%}
        input:focus,textarea:focus{border-color:var(--accent)}
        textarea{resize:vertical;min-height:100px}
        .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;font-family:'Manrope',sans-serif;cursor:pointer;border:none;text-decoration:none;transition:all .15s}
        .btn-success{background:var(--accent2);color:#000}.btn-success:hover{background:#46c75b}
        .btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}.btn-outline:hover{background:#161b22}
        .btn-group{display:flex;gap:12px;margin-top:20px}
        .alert{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.3);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--accent2);margin-bottom:20px}
    </style>
</head>
<body>
<header class="header">
    <a href="/" class="logo"><div class="logo-icon">📄</div><div class="logo-name">Практика<span>Док</span></div></a>
    <a href="/profile/#my-docs" class="btn btn-outline" style="padding:6px 14px;font-size:13px">← Назад</a>
</header>

<div class="main">
    {% if messages %}{% for m in messages %}<div class="alert">{{ m }}</div>{% endfor %}{% endif %}

    <div class="page-title">✏️ Редактировать характеристику</div>
    <p class="page-sub">{{ doc.fio }}</p>

    <form method="post">
        {% csrf_token %}

        <!-- Данные практиканта -->
        <div class="card">
            <div class="card-head"><div class="card-title">Данные практиканта</div></div>
            <div class="card-body">
                <div class="form-row">
                    <div class="form-group full">
                        <label>ФИО практиканта</label>
                        <input type="text" name="fio" value="{{ doc.fio }}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group full">
                        <label>Подразделение, должность, место практики</label>
                        <input type="text" name="library" value="{{ doc.library }}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group full">
                        <label>Специальность</label>
                        <input type="text" name="speciality" value="{{ doc.speciality }}">
                    </div>
                </div>
            </div>
        </div>

        <!-- Период и посещаемость -->
        <div class="card">
            <div class="card-head"><div class="card-title">Период и посещаемость</div></div>
            <div class="card-body">
                <div class="form-row">
                    <div class="form-group">
                        <label>Дата начала</label>
                        <input type="date" name="work_start" value="{{ doc.work_start|date:'Y-m-d' }}">
                    </div>
                    <div class="form-group">
                        <label>Дата окончания</label>
                        <input type="date" name="work_end" value="{{ doc.work_end|date:'Y-m-d' }}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Количество выходов (дней)</label>
                        <input type="number" name="work_days_count" value="{{ doc.work_days_count }}" min="0">
                    </div>
                    <div class="form-group">
                        <label>Пропущено дней (всего)</label>
                        <input type="number" name="missed_days" value="{{ doc.missed_days }}" min="0">
                    </div>
                    <div class="form-group">
                        <label>Из них по неуважительной причине</label>
                        <input type="number" name="missed_unexcused" value="{{ doc.missed_unexcused }}" min="0">
                    </div>
                </div>
            </div>
        </div>

        <!-- Оценка работы -->
        <div class="card">
            <div class="card-head"><div class="card-title">Оценка работы</div></div>
            <div class="card-body">
                <div class="form-row">
                    <div class="form-group full">
                        <label>Качество выполнения работы</label>
                        <textarea name="work_quality">{{ doc.work_quality }}</textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- Руководитель -->
        <div class="card">
            <div class="card-head"><div class="card-title">Руководитель практики от организации</div></div>
            <div class="card-body">
                <div class="form-row">
                    <div class="form-group full">
                        <label>Должность, ФИО</label>
                        <input type="text" name="supervisor" value="{{ doc.supervisor }}">
                    </div>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-success">💾 Сохранить изменения</button>
            <a href="/profile/#my-docs" class="btn btn-outline">Отмена</a>
        </div>
    </form>
</div>
</body>
</html>
